backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "portfolio"
    label: "Portfólio"
    files:
      - file: "data/portfolio.json"
        label: "Gerir Fotografias"
        name: "portfolio_data"
        fields:
          - label: "Lista de Fotos"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Título da Foto", name: "title", widget: "string" }
              - { label: "Categoria", name: "category", widget: "select", options: ["gestante", "casal", "feminino", "fitness", "eventos"] }
              - { label: "Local / Subtítulo", name: "sub", widget: "string" }
              - { label: "Imagem", name: "image", widget: "image" }
