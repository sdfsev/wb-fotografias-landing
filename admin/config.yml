backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "portfolio"
    label: "Portfólio de Fotos"
    label_sing: "Fotografia"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    summary: "{{title}} — [{{category}}]"
    fields:
      - { label: "Título do Ensaio / Foto", name: "title", widget: "string", hint: "Ex: Ensaio de Gestante no Parque" }
      - { label: "Categoria do Ensaio", name: "category", widget: "select", options: ["gestante", "casal", "feminino", "fitness", "eventos"], default: "gestante", hint: "Seleciona onde esta foto vai aparecer no site" }
      - { label: "Local ou Subtítulo (Opcional)", name: "sub", widget: "string", required: false, hint: "Ex: Parque Verde • Coimbra" }
      - { label: "Fotografia (Ficheiro)", name: "image", widget: "image", hint: "Carrega a foto em alta qualidade" }
