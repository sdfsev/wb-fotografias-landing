backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "portfolio"
    label: "Fotos do Portfólio"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Ensaio", name: "title", widget: "string" }
      - { label: "Categoria", name: "category", widget: "select", options: ["gestante", "casal", "feminino", "fitness", "eventos"] }
      - { label: "Imagem", name: "image", widget: "image" }
      - { label: "Descrição Curta", name: "description", widget: "string", required: false }
