<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Editorial | WB Fotografias</title>
    
    <!-- Google Fonts idênticas às da Landing Page -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Script do Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      /* Base & Tipografia da Marca */
      *, *::before, *::after {
        box-sizing: border-box !important;
      }

      body, #nc-root {
        background-color: #121110 !important;
        color: #F7F5F0 !important;
        font-family: 'Inter', sans-serif !important;
      }

      /* Cabeçalho do Admin */
      header, nav[class*="AppHeader"] {
        background-color: #1B1A18 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: none !important;
      }

      /* Títulos em Cabinet Grotesk */
      h1, h2, h3, h4, h5, [class*="SidebarHeading"], [class*="CollectionTop"] {
        font-family: 'Cabinet Grotesk', sans-serif !important;
        font-weight: 800 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        color: #FFFFFF !important;
      }

      /* Botões em Monospace e Caixa Alta (Estilo do Site) */
      button, a[class*="Button"], [class*="ControlPane"] button {
        font-family: 'Space Mono', monospace !important;
        text-transform: uppercase !important;
        font-size: 11px !important;
        letter-spacing: 0.1em !important;
        border-radius: 0px !important;
        transition: all 0.3s ease !important;
      }

      /* Botão Principal: Adicionar Novo Ensaio / Publicar */
      a[href*="/new"], button[class*="PublishButton"], button[class*="SaveButton"] {
        background-color: #D87D56 !important;
        color: #FFFFFF !important;
        border: 1px solid #D87D56 !important;
        padding: 10px 20px !important;
        font-weight: 700 !important;
      }

      a[href*="/new"]:hover, button[class*="PublishButton"]:hover {
        background-color: #FFFFFF !important;
        color: #121110 !important;
        border-color: #FFFFFF !important;
      }

      /* Botão de ELIMINAR / APAGAR em Destaque Vermelho/Aviso */
      button[class*="DeleteButton"] {
        background-color: transparent !important;
        border: 1px solid #E53E3E !important;
        color: #FC8181 !important;
        padding: 8px 16px !important;
        margin-top: 10px !important;
      }

      button[class*="DeleteButton"]:hover {
        background-color: #E53E3E !important;
        color: #FFFFFF !important;
      }

      /* Cards na Lista de Fotos */
      [class*="Card"], [class*="CollectionCard"], div[class*="GridCard"] {
        background-color: #1B1A18 !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 0px !important;
        padding: 16px !important;
        transition: border-color 0.3s ease, transform 0.3s ease !important;
      }

      [class*="Card"]:hover {
        border-color: #D87D56 !important;
        transform: translateY(-2px) !important;
      }

      /* Caixas de Texto, Form e Inputs */
      [class*="ControlPane"] {
        background-color: #121110 !important;
      }

      div[class*="ControlContainer"] {
        background-color: #1B1A18 !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 0px !important;
        padding: 20px !important;
        margin-bottom: 24px !important;
      }

      /* Rótulos dos Campos (Labels) com Informação Clara */
      label[class*="ControlLabel"] {
        color: #D87D56 !important;
        font-family: 'Space Mono', monospace !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.1em !important;
        margin-bottom: 8px !important;
        display: block !important;
      }

      /* Dicas explicativas sob cada campo */
      span[class*="Hint"] {
        color: #8C867E !important;
        font-size: 12px !important;
        font-style: normal !important;
        margin-top: 6px !important;
        display: block !important;
      }

      /* Inputs, Selects e Dropdowns */
      input[type="text"], select, textarea {
        background-color: #121110 !important;
        color: #F7F5F0 !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        border-radius: 0px !important;
        padding: 12px 14px !important;
        font-size: 14px !important;
        width: 100% !important;
      }

      input[type="text"]:focus, select:focus, textarea:focus {
        border-color: #D87D56 !important;
        outline: none !important;
      }

      /* Caixa de Upload de Imagem */
      div[class*="FileControl"] {
        border: 1px dashed #D87D56 !important;
        background-color: #121110 !important;
        padding: 24px !important;
        text-align: center !important;
      }
    </style>
  </head>
  <body>
    <!-- Script do Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
