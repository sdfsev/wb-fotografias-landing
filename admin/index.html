<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Gestão | WB Fotografias</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Script Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      *, *::before, *::after {
        box-sizing: border-box !important;
      }

      body, #nc-root {
        background-color: #121110 !important;
        color: #F7F5F0 !important;
        font-family: 'Inter', sans-serif !important;
      }

      /* Cabeçalho */
      header, nav[class*="AppHeader"] {
        background-color: #1B1A18 !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        box-shadow: none !important;
      }

      /* Títulos em Cabinet Grotesk */
      h1, h2, h3, h4, [class*="SidebarHeading"], [class*="CollectionTop"] {
        font-family: 'Cabinet Grotesk', sans-serif !important;
        font-weight: 800 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.05em !important;
        color: #FFFFFF !important;
      }

      /* Botões em Monospace e Caixa Alta */
      button, a[class*="Button"] {
        font-family: 'Space Mono', monospace !important;
        text-transform: uppercase !important;
        font-size: 11px !important;
        letter-spacing: 0.1em !important;
        border-radius: 0px !important;
        transition: all 0.3s ease !important;
      }

      /* Botão de Guardar / Publicar */
      button[class*="PublishButton"], button[class*="SaveButton"] {
        background-color: #D87D56 !important;
        color: #FFFFFF !important;
        border: 1px solid #D87D56 !important;
        padding: 10px 22px !important;
        font-weight: 700 !important;
      }

      button[class*="PublishButton"]:hover {
        background-color: #FFFFFF !important;
        color: #121110 !important;
        border-color: #FFFFFF !important;
      }

      /* Botão de Adicionar Nova Foto */
      button[class*="AddButton"] {
        background-color: #1B1A18 !important;
        border: 1px border #D87D56 !important;
        color: #D87D56 !important;
        padding: 12px 20px !important;
        width: 100% !important;
        margin-top: 15px !important;
      }

      button[class*="AddButton"]:hover {
        background-color: #D87D56 !important;
        color: #FFFFFF !important;
      }

      /* Cards das Fotos na Lista */
      div[class*="ListItem"], div[class*="ObjectControl"] {
        background-color: #1B1A18 !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-radius: 0px !important;
        padding: 20px !important;
        margin-bottom: 20px !important;
      }

      /* Botão de ELIMINAR / APAGAR Foto */
      button[class*="RemoveButton"], button[class*="DeleteButton"] {
        background-color: rgba(229, 62, 62, 0.1) !important;
        border: 1px solid #E53E3E !important;
        color: #FC8181 !important;
        padding: 6px 14px !important;
        float: right !important;
      }

      button[class*="RemoveButton"]:hover, button[class*="DeleteButton"]:hover {
        background-color: #E53E3E !important;
        color: #FFFFFF !important;
      }

      /* Labels dos Campos */
      label {
        color: #D87D56 !important;
        font-family: 'Space Mono', monospace !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.08em !important;
        margin-top: 12px !important;
        margin-bottom: 6px !important;
        display: block !important;
      }

      /* Dicas explicativas */
      span[class*="Hint"] {
        color: #8C867E !important;
        font-size: 11px !important;
        margin-bottom: 8px !important;
        display: block !important;
      }

      /* Inputs e Caixas de Seleção */
      input[type="text"], select {
        background-color: #121110 !important;
        color: #F7F5F0 !important;
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        border-radius: 0px !important;
        padding: 12px !important;
        font-size: 14px !important;
        width: 100% !important;
      }

      input[type="text"]:focus, select:focus {
        border-color: #D87D56 !important;
        outline: none !important;
      }

      /* Caixa de Upload */
      div[class*="FileControl"] {
        border: 1px dashed #D87D56 !important;
        background-color: #121110 !important;
        padding: 20px !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
